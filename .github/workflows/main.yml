name: Build AYNA Debug APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build with Gradle
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "source/AYNA/gradlew" ]; then
          cd source/AYNA
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Gradle wrapper not found!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AYNA-Debug-APK
        path: '**/build/outputs/apk/debug/app-debug.apk'
